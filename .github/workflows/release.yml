name: Build & Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses and install packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Build release APK
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Prepare release assets
        id: assets
        run: |
          if [ ! -d app/build/outputs/apk ]; then
            ls -la app/build/outputs || true
            echo "No APKs found in app/build/outputs/apk" >&2
            exit 1
          fi
          FILES=$(find app/build/outputs/apk -type f -name "app-*.apk" | xargs echo | sed 's/ /,/g')
          if [ -z "$FILES" ]; then
            echo "No APKs found in app/build/outputs/apk" >&2
            exit 1
          fi
          echo "files=$FILES" >> $GITHUB_OUTPUT

      - name: Get version name
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | head -1 | awk -F'"' '{print $2}')
          if [ -z "$VERSION" ]; then VERSION="1.0.0"; fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ steps.version.outputs.version }}-build.${{ github.run_number }}
          name: PhotoSearch v${{ steps.version.outputs.version }} (Build ${{ github.run_number }})
          artifacts: ${{ steps.assets.outputs.files }}
          body: |
            ## PhotoSearch v${{ steps.version.outputs.version }}

            **Build:** #${{ github.run_number }}
            **Commit:** ${{ github.sha }}
            **Branch:** ${{ github.ref_name }}

            ### Downloads
            - 📦 `app-debug.apk` — Debug build (未签名)
            - 📦 `app-release-unsigned.apk` — Release build (未签名)
          makeLatest: true
          allowUpdates: true
          token: ${{ secrets.GITHUB_TOKEN }}
